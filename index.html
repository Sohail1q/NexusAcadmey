<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // AI Studio preview environment: HMR is disabled, ignore transient [vite] WebSocket messages
      (function() {
        var origError = console.error;
        console.error = function() {
          var msg = arguments[0];
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            return;
          }
          return origError.apply(console, arguments);
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = e && e.reason;
          var msg = reason && (reason.message || String(reason));
          if (typeof msg === 'string' && (msg.indexOf('[vite]') !== -1 || msg.indexOf('WebSocket') !== -1)) {
            e.preventDefault();
          }
        });
      })();
    </script>
