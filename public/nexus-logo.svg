<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Crown on Top -->
  <g fill="#800020" filter="url(#shadow)">
    <circle cx="190" cy="70" r="8" fill="#800020"/>
    <circle cx="220" cy="60" r="7" fill="#800020"/>
    <circle cx="250" cy="50" r="10" fill="#800020"/>
    <circle cx="280" cy="60" r="7" fill="#800020"/>
    <circle cx="310" cy="70" r="8" fill="#800020"/>
    <path d="M 190 75 L 210 115 L 250 85 L 290 115 L 310 75 L 325 125 C 325 130 320 135 310 135 L 190 135 C 180 135 175 130 175 125 Z" />
    <rect x="185" y="138" width="130" height="8" rx="4" fill="#800020"/>
  </g>

  <!-- Outer Shield Border -->
  <path d="M 250 145 C 350 145 365 210 365 310 C 365 375 315 425 250 460 C 185 425 135 375 135 310 C 135 210 150 145 250 145 Z" 
        fill="#ffffff" stroke="#800020" stroke-width="18" stroke-linejoin="round" filter="url(#shadow)"/>

  <!-- Inner Shield Border Line -->
  <path d="M 250 162 C 335 162 348 220 348 305 C 348 360 305 405 250 436 C 195 405 152 360 152 305 C 152 220 165 162 250 162 Z" 
        fill="none" stroke="#800020" stroke-width="3" stroke-dasharray="4,3"/>

  <!-- Text: NEXUS CONNECTING YOU TO SUCCESS -->
  <text x="250" y="195" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#800020" text-anchor="middle" letter-spacing="2">NEXUS</text>
  <text x="250" y="210" font-family="'Inter', sans-serif" font-weight="600" font-size="9" fill="#800020" text-anchor="middle" letter-spacing="1">CONNECTING YOU TO SUCCESS</text>

  <!-- Academy Temple Architecture -->
  <g fill="#800020">
    <!-- Pediment Roof -->
    <polygon points="250,225 185,260 315,260" />
    <rect x="180" y="260" width="140" height="8" rx="2" />
    <!-- Pillars -->
    <rect x="200" y="272" width="16" height="52" rx="2" />
    <rect x="242" y="272" width="16" height="52" rx="2" />
    <rect x="284" y="272" width="16" height="52" rx="2" />
    <!-- Base Steps -->
    <rect x="180" y="326" width="140" height="8" rx="2" />
    <rect x="170" y="335" width="160" height="9" rx="2" />
  </g>

  <!-- Banner Ribbon -->
  <g filter="url(#shadow)">
    <!-- Ribbon Tails -->
    <polygon points="90,390 145,360 145,435 90,445 105,417" fill="#580016" />
    <polygon points="410,390 355,360 355,435 410,445 395,417" fill="#580016" />
    <!-- Ribbon Body -->
    <path d="M 125 365 L 375 365 L 390 435 L 110 435 Z" fill="#800020" />
    <path d="M 125 365 L 375 365 L 388 433 L 112 433 Z" fill="none" stroke="#ffffff" stroke-width="1.5" opacity="0.6"/>

    <!-- Banner Details -->
    <!-- Floral flourishes -->
    <path d="M 135 395 Q 150 380 160 395 Q 150 410 135 395" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="148" cy="395" r="3" fill="#ffffff" opacity="0.9"/>
    <path d="M 365 395 Q 350 380 340 395 Q 350 410 365 395" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.8"/>
    <circle cx="352" cy="395" r="3" fill="#ffffff" opacity="0.9"/>

    <!-- Main Banner Text -->
    <text x="250" y="392" font-family="'Inter', sans-serif" font-weight="900" font-size="22" fill="#ffffff" text-anchor="middle" letter-spacing="3">NEXUS</text>
    <line x1="200" y1="398" x2="300" y2="398" stroke="#ffffff" stroke-width="2" />
    <text x="250" y="412" font-family="'Inter', sans-serif" font-weight="600" font-size="8.5" fill="#ffffff" text-anchor="middle" letter-spacing="0.5">ENGLISH, COMPUTER &amp; HOME TUITION ACADEMY</text>
  </g>

  <!-- Shield Bottom Year Badge -->
  <text x="250" y="445" font-family="'Inter', sans-serif" font-weight="800" font-size="13" fill="#800020" text-anchor="middle" letter-spacing="2">2026</text>
</svg>
